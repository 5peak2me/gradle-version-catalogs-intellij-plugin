name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Restore Gradle cache
        uses: burrunan/gradle-cache-action@v3.0.3
        continue-on-error: true
      - name: Publish
        run: ./gradlew publishPlugin
        env:
          INTELLIJ_TOKEN: ${{ secrets.INTELLIJ_TOKEN }}
