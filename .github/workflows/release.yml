name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20+8'
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.ref }}
      - name: Publish
        uses: burrunan/gradle-cache-action@v3.0.2
        with:
          arguments: publishPlugin
        env:
          INTELLIJ_TOKEN: ${{ secrets.INTELLIJ_TOKEN }}
